name: Запуск AI Бота

# Триггеры: запуск вручную или по расписанию (каждые 30 минут)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Ограничение: GitHub даст боту работать макс. 60 минут за один запуск

    steps:
      - name: 📥 Скачать код из репозитория
        uses: actions/checkout@v4

      - name: 🐍 Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Установить библиотеки из requirements.txt
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Запустить бота
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
        run: python bot.py
